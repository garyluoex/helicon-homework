<style>

    }
  }

    --ground: #0A0F16;
    --surface: #121A24;
    --surface-2: #19232F;
    --sunken: #0E151E;
    --border: #24313F;
    --border-soft: #1B2531;
    --ink: #E7EDF5;
    --ink-2: #BAC7D8;
    --muted: #8395AA;
    --accent: #74AAE8;
    --accent-ink: #9DC6F4;

  .cov-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;

  .cov-row .type { color: var(--ink-2); min-width: 148px; }

  .tab[aria-selected="true"] .tag.ok { color: var(--good); }
  .tab[aria-selected="true"] .tag.late { color: var(--warn); }
  .tab[aria-selected="true"] .tag.anomaly, .tab[aria-selected="true"] .tag.open { color: var(--bad); }

  .panelwrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;

  .panel { padding: 26px 26px 30px; display: grid; gap: 26px; }
  @media (max-width: 620px) { .panel { padding: 20px 16px 24px; } }
  .panel[hidden] { display: none; }

  /* ---------- job header ---------- */
  .jobhead { display: grid; gap: 14px; }
  .jobtitle { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .jobtitle .id { font-family: "JetBrains Mono", monospace; font-weight: 700;

  .verdict { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));

           border-radius: 6px; overflow: hidden; }
  .facts div { background: var(--surface); padding: 9px 12px; }
  .facts .k { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;
              letter-spacing: .09em; font-size: 11.5px; color: var(--muted); }

  .kpi { border-left: 2px solid var(--accent-line); padding-left: 12px; }

  .kpi .k { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;
            letter-spacing: .09em; font-size: 12px; color: var(--muted); }

  .flag.warn { border-left-color: var(--warn); }

  .flag.info .sev { color: var(--accent-ink); }
  .flag h3 { font-family: Chivo, sans-serif; }
  .flag p { grid-column: 2; margin: 0; font-size: 14.5px; color: var(--ink-2); }

  /* ---------- panels grid ---------- */
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 14px 16px;
         display: grid; gap: 10px; align-content: start; }
  .box .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .chart { display: flex; align-items: flex-end; gap: 1px; height: 74px; background: var(--sunken);
           border-radius: 4px; padding: 6px 6px 0; overflow: hidden; }
  .chart i { flex: 1 1 0; min-width: 1px; background: var(--accent); border-radius: 1px 1px 0 0;

  .chart i.hi { background: var(--bad); opacity: .9; }
  .axis { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace;
          font-size: 11px; color: var(--muted); }
  .rows { display: grid; gap: 5px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
         font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  .row .track { grid-column: 1 / -1; height: 5px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
  .row .track i { display: block; height: 100%; background: var(--accent-line); }
  .row .n { color: var(--muted); }
  .stack { display: flex; height: 26px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-soft); }
  .stack span { display: grid; place-items: center; font-family: "JetBrains Mono", monospace; font-size: 11px;
                color: var(--surface); }
  .stack .good { background: var(--good); }
  .stack .scrap { background: var(--bad); }
  .stack .none { background: var(--sunken); color: var(--muted); }
  .taglist { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 12px; background: var(--surface-2);
          border: 1px solid var(--border-soft); border-radius: 999px; padding: 2px 9px; color: var(--ink-2); }
  .pill b { color: var(--muted); font-weight: 400; }

  .tlhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tlbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;

         border: 1px solid var(--accent-line); border-radius: 5px; padding: 4px 11px; cursor: pointer; }
  .btn:hover { background: var(--accent-wash); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tl { display: grid; gap: 0; }
  .day { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
  .day .d { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;
            letter-spacing: .1em; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .day .rule { flex: 1; height: 1px; background: var(--border); }
  .ev { display: grid; grid-template-columns: 64px 16px 1fr; gap: 0 10px; align-items: start;
        position: relative; padding: 5px 0; }
  .ev .t { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); text-align: right;
           padding-top: 1px; }
  .ev .t .g { display: block; font-size: 10.5px; opacity: .8; }
  .ev .rail { position: relative; justify-self: center; width: 16px; }
  .ev .rail::before { content: ""; position: absolute; left: 7px; top: -6px; bottom: -16px; width: 2px;
                      background: var(--border); }
  .ev:last-child .rail::before { bottom: 50%; }
  .ev .dot { position: absolute; left: 4px; top: 5px; width: 8px; height: 8px; border-radius: 50%;
             background: var(--border); border: 2px solid var(--surface); box-sizing: content-box; }
  .ev.ms .dot { left: 1px; top: 2px; width: 12px; height: 12px; background: var(--accent); }
  .ev.sev-good .dot { background: var(--good); }
  .ev.sev-bad .dot { background: var(--bad); }

  .ev .ttl { font-family: "JetBrains Mono", monospace; font-size: 13.5px; font-weight: 500; }

  .rec { margin-top: 8px; border: 1px solid var(--border-soft); border-radius: 6px; overflow: hidden;

  .rec-grp { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: stretch;
             border-top: 1px solid var(--border-soft); }
  .rec-grp:first-child { border-top: 0; }
  .rec-lbl { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;
             letter-spacing: .1em; font-size: 11px; color: var(--muted); padding: 7px 9px;
             background: var(--surface-2); border-right: 1px solid var(--border-soft); }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
        gap: 0 20px; padding: 6px 12px 7px; }
  .kv > div { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px;
              align-items: baseline; font-family: "JetBrains Mono", monospace; font-size: 11.5px;
              font-variant-numeric: tabular-nums; line-height: 1.75; }
  .kv .k { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv .v { color: var(--ink-2); word-break: break-word; }
  .kv .v.null { color: var(--bad); }
  .kv .v.num { color: var(--ink); font-weight: 500; }
  .tl.compact .rec { display: none; }
  .ev.run .body { background: var(--surface-2); border-radius: 6px; padding: 9px 12px; }
  .ev.run .strip { display: flex; align-items: flex-end; gap: 1px; height: 20px; margin-top: 7px; }
  .ev.run .strip i { flex: 1 1 0; min-width: 1px; background: var(--accent-line); border-radius: 1px; }
  .ev.child { display: none; }
  .ev.child.show { display: grid; }
  .ev.child .t { opacity: .75; }
  .chip { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;
          letter-spacing: .07em; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
          margin-left: 7px; white-space: nowrap; }
  .chip.pass { background: var(--good-wash); color: var(--good); }
  .chip.fail { background: var(--bad-wash); color: var(--bad); }
  .chip.warn { background: var(--warn-wash); color: var(--warn); }
  .chip.info { background: var(--accent-wash); color: var(--accent-ink); }
  .runbtn { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase;

  .runbtn:hover { text-decoration: underline; }
  .runbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 14px;

  a { color: var(--accent-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: fade .18s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const dur = h => h >= 24 ? (h / 24).toFixed(1) + ' d' : h >= 1 ? h.toFixed(1) + ' h' : Math.round(h * 60) + ' m';
const gapStr = h => h <= 0 ? '' : h < 1 ? '+' + Math.round(h * 60) + 'm' : h < 24 ? '+' + h.toFixed(1) + 'h' : '+' + (h / 24).toFixed(1) + 'd';

/* ---------------- panel rendering ---------------- */
function ribbon(j) {
  const total = j.phases.reduce((a, p) => a + p.hours, 0) || 1;
  const segs = j.phases.map(p =>
    `<div class="seg ${p.kind}" style="flex:${p.hours} 0 0" title="${esc(p.label)}: ${dur(p.hours)}"></div>`).join('');
  const leg = j.phases.map(p =>
    `<span><b>${esc(p.label)}</b> ${dur(p.hours)} \u00b7 ${Math.round(100 * p.hours / total)}%</span>`).join('');
  const first = j.phases.length ? j.phases[0].start : j.window[0];
  const last = j.phases.length ? j.phases[j.phases.length - 1].end : j.window[1];
  return `<div class="ribbon">
    <div class="lbl">Where the time went</div>
    <div class="bars">${segs}</div>
    <div class="ends"><span>${esc(first.replace('T', ' ').replace('Z', ''))}</span><span>${esc(last.replace('T', ' ').replace('Z', ''))}</span></div>
    <div class="legend">${leg}</div>
  </div>`;
}

function cycleBox(j) {
  if (!j.cycle_stats) return '';
  const s = j.cycle_stats, max = s.max;
  const bars = j.cycle_times.map(v =>
    `<i class="${v === max && max >= 1800 ? 'hi' : ''}" style="height:${Math.max(4, Math.round(100 * v / max))}%" title="${v} s"></i>`).join('');
  return `<div class="box">
    <div class="hd"><h2>Cycle time</h2><span class="mono" style="font-size:12px;color:var(--muted)">${s.n} cycles, seconds</span></div>
    <div class="chart">${bars}</div>
    <div class="axis"><span>min ${fmt(s.min)}</span><span>median ${fmt(s.median)}</span><span>mean ${fmt(s.mean)}</span><span>max ${fmt(s.max)}</span></div>
  </div>`;
}

function unitsBox(j) {
  const u = j.units;
  const done = u.good !== null;
  const stack = done
    ? `<div class="stack">
         <span class="good" style="flex:${u.good}">${fmt(u.good)} good</span>
         <span class="scrap" style="flex:${u.scrap}">${fmt(u.scrap)}</span>
       </div>`
    : `<div class="stack"><span class="none" style="flex:1">no completion event</span></div>`;
  const lines = [
    ['Order target', fmt(u.target) + ' units'],
    ['Cycle output', fmt(u.cycle_units) + ' units \u00b7 ' + Math.round(100 * u.cycle_units / u.target) + '% of target'],
    ['Inspected', u.pass_units + u.fail_units ? fmt(u.pass_units + u.fail_units) + ' units \u00b7 ' + fmt(u.pass_units) + ' pass / ' + fmt(u.fail_units) + ' fail' : 'never inspected'],
    ['Closed out', done ? fmt(u.good) + ' good / ' + fmt(u.scrap) + ' scrap \u00b7 ' + (100 * u.scrap / (u.good + u.scrap)).toFixed(1) + '% scrap' : 'no completion event'],
  ];
  return `<div class="box">
    <div class="hd"><h2>Units</h2><span class="mono" style="font-size:12px;color:var(--muted)">target ${fmt(u.target)}</span></div>
    ${stack}
    <div class="rows">${lines.map(([k, v]) =>
      `<div class="row"><span class="n">${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>
  </div>`;
}

function defectBox(j) {
  if (!j.defects.length) return '';
  const tot = j.defects.reduce((a, d) => a + d[1], 0);
  return `<div class="box">
    <div class="hd"><h2>Rejects by defect</h2><span class="mono" style="font-size:12px;color:var(--muted)">${tot} events</span></div>
    <div class="rows">${j.defects.map(([d, c]) => `
      <div class="row"><span>${esc(d)}</span><span class="n">${c}</span>
        <span class="track"><i style="width:${100 * c / j.defects[0][1]}%"></i></span></div>`).join('')}</div>
  </div>`;
}

function castBox(j) {
  const grp = (label, list) => list.length
    ? `<div><div class="lbl">${label}</div><div class="taglist">${list.map(([k, c]) =>
        `<span class="pill">${esc(k)} <b>${c}</b></span>`).join('')}</div></div>` : '';
  return `<div class="box">
    <div class="hd"><h2>Assets and people</h2><span class="mono" style="font-size:12px;color:var(--muted)">event counts</span></div>
    ${grp('Machines', j.machines)}${grp('Tools', j.tools)}${grp('Operators', j.operators)}${grp('Inspectors', j.inspectors)}
  </div>`;
}

const SEV = {
  job_completed: 'good', inspection_passed: 'good', tool_ready: 'good', job_unblocked: 'good',
  inspection_failed: 'bad', job_blocked: 'bad', job_hold: 'warn', sensor_glitch: 'warn',
  maintenance_ping: 'warn',
};

/* every field of the record, verbatim: the 9 top-level keys, then the metadata keys */
function fieldGrid(e) {
  const pair = ([k, v]) => {
    const nul = v === null;
    const num = typeof v === 'number';
    return `<div><span class="k">${esc(k)}</span>` +
      `<span class="v ${nul ? 'null' : num ? 'num' : ''}">${esc(nul ? 'null' : v)}</span></div>`;
  };
  const md = Object.entries(e.md);
  return `<div class="rec">
    <div class="rec-grp"><div class="rec-lbl">Record</div>
      <div class="kv">${e.raw.map(pair).join('')}</div></div>
    ${md.length ? `<div class="rec-grp"><div class="rec-lbl">Metadata</div>
      <div class="kv">${md.map(pair).join('')}</div></div>` : ''}
  </div>`;
}

function eventLine(e) {
  const md = e.md;
  const bits = [];
  if (e.machine) bits.push(`<em>${esc(e.machine)}</em>`);
  else if (['cycle_completed','inspection_passed','inspection_failed','job_started'].includes(e.type)) bits.push('no machine');
  if (md.tool_id) bits.push(esc(md.tool_id));
  if (md.operator_id) bits.push('op ' + esc(md.operator_id));
  if (md.inspector_id) bits.push('insp ' + esc(md.inspector_id));
  if (md.cycle_time_seconds) bits.push(md.cycle_time_seconds + ' s');
  if (e.qty) bits.push(fmt(e.qty) + ' units');
  if (md.defect_code) bits.push('defect <em>' + esc(md.defect_code) + '</em>');
  if (md.reason) bits.push('reason <em>' + esc(md.reason) + '</em>');
  if (md.signal) bits.push('signal <em>' + esc(md.signal) + '</em>');
  if (md.lot_id) bits.push(esc(md.lot_id));
  if (md.priority) bits.push(esc(md.priority) + ' priority');
  if (md.target_due_at) bits.push('due ' + md.target_due_at.slice(0, 10));
  if (md.unit_price_estimate) bits.push('$' + md.unit_price_estimate.toFixed(2) + '/unit');
  if (md.good_quantity !== undefined) bits.push(fmt(md.good_quantity) + ' good, ' + fmt(md.scrap_quantity) + ' scrap');
  bits.push(esc(e.id));
  const chips = e.flags.map(f =>
    `<span class="chip ${f.includes('duplicate') ? 'fail' : 'warn'}">${esc(f)}</span>`).join('');
  const sev = SEV[e.type] || '';
  return `<div class="ev ${e.milestone ? 'ms' : ''} ${sev ? 'sev-' + sev : ''} ${e.child ? 'child' : ''}">
    <div class="t">${hhmm(e.ts)}<span class="g">${gapStr(e.gap)}</span></div>
    <div class="rail"><span class="dot"></span></div>
    <div class="body">
      <div class="ttl">${esc(e.type)}${chips}</div>
      <div class="meta">${bits.join(' \u00b7 ')}</div>
      ${fieldGrid(e)}
    </div>
  </div>`;
}

function runBlock(run, idx) {
  const first = run[0], last = run[run.length - 1];
  const h = (P(last.ts) - P(first.ts)) / 3600000;
  const units = run.reduce((a, e) => a + e.qty, 0);
  const cts = run.map(e => e.md.cycle_time_seconds).filter(Boolean);
  const mx = Math.max(...cts, 1);
  const strip = run.map(e => `<i style="height:${Math.max(12, Math.round(100 * (e.md.cycle_time_seconds || 0) / mx))}%"></i>`).join('');
  const flagged = run.filter(e => e.flags.length).length;
  return `<div class="ev run">
    <div class="t">${hhmm(first.ts)}<span class="g">${dur(h)}</span></div>
    <div class="rail"><span class="dot"></span></div>
    <div class="body">
      <div class="ttl">${run.length} press cycles${flagged ? `<span class="chip warn">${flagged} flagged</span>` : ''}</div>
      <div class="meta">${fmt(units)} units \u00b7 ${hhmm(first.ts)} to ${hhmm(last.ts)} \u00b7 cycle time ${Math.min(...cts)} to ${Math.max(...cts)} s</div>
      <div class="strip">${strip}</div>
      <button class="runbtn" type="button" data-run="${idx}">Show ${run.length} cycles</button>
    </div>
  </div>` + run.map(e => eventLine({ ...e, child: true })).join('').replace(/class="ev /g, `data-run-child="${idx}" class="ev `);
}

function timeline(j) {
  const out = [];
  let day = null, run = [], runIdx = 0;
  const flushRun = () => { if (run.length) { out.push(run.length > 2 ? runBlock(run, runIdx++) : run.map(eventLine).join('')); run = []; } };
  j.events.forEach(e => {
    const d = dayKey(e.ts);
    if (e.type === 'cycle_completed' && d === day) { run.push(e); return; }
    flushRun();
    if (d !== day) {
      day = d;
      out.push(`<div class="day"><span class="d">${dayLabel(e.ts)}</span><span class="rule"></span></div>`);
      if (e.type === 'cycle_completed') { run.push(e); return; }
    }
    out.push(eventLine(e));
  });
  flushRun();
  return `<section>
    <div class="tlhead"><h2>Complete event timeline</h2>
      <div class="tlbtns">
        <button class="btn" type="button" data-fields="${j.id}">Hide field detail</button>
        <button class="btn" type="button" data-all="${j.id}">Expand all cycles</button>
      </div></div>
    <div class="tl" id="tl-${j.id}">${out.join('')}</div>
  </section>`;
}

function panel(j, i) {
  const f = j.facts;
  const facts = [
    ['Customer', f.customer], ['Part', f.part], ['Material', f.material],
    ['Priority', f.priority], ['Facility', f.facility],
    ['Order qty', fmt(f.target)], ['Created', f.created.slice(0, 10)], ['Due', f.due.slice(0, 10)],
    ['Events', fmt(j.n_events)],
  ];
  if (f.value) facts.push(['Est. value', '$' + fmt(f.value)]);
  return `<div class="panel" role="tabpanel" id="panel-${j.id}" aria-labelledby="tab-${j.id}" ${i === 0 ? '' : 'hidden'} tabindex="0">
    <div class="jobhead">
      <div class="jobtitle"><span class="id">${esc(j.id)}</span>
        <span class="verdict ${j.verdict}">${esc(j.tagline)}</span></div>
      <div class="facts">${facts.map(([k, v]) =>
        `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    </div>
    <div class="kpis">${j.kpis.map(([k, v, s]) =>
      `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join('')}</div>
    ${ribbon(j)}
    <div class="prose">${j.narrative.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="flags">${j.flags.map(([sev, title, body]) =>
      `<div class="flag ${sev}"><span class="sev">${sev === 'info' ? 'note' : sev}</span><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`).join('')}</div>
    <div class="grid2">${cycleBox(j)}${unitsBox(j)}${defectBox(j)}${castBox(j)}</div>
    ${timeline(j)}
  </div>`;
}

panels.innerHTML = DATA.jobs.map(panel).join('');

/* ---------------- tab behaviour ---------------- */
const tabEls = [...tabs.querySelectorAll('.tab')];
function select(i, focus) {
  tabEls.forEach((t, k) => {
    const on = k === i;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    document.getElementById('panel-' + DATA.jobs[k].id).hidden = !on;
  });
  if (focus) tabEls[i].focus();
  history.replaceState(null, '', '#' + DATA.jobs[i].id);
}
tabs.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) select(+t.dataset.i, true);
});
tabs.addEventListener('keydown', e => {
  const cur = tabEls.findIndex(t => t.getAttribute('aria-selected') === 'true');
  const n = tabEls.length;
  if (e.key === 'ArrowRight') { select((cur + 1) % n, true); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { select((cur - 1 + n) % n, true); e.preventDefault(); }
  if (e.key === 'Home') { select(0, true); e.preventDefault(); }
  if (e.key === 'End') { select(n - 1, true); e.preventDefault(); }
});
const fromHash = DATA.jobs.findIndex(j => '#' + j.id === location.hash);
if (fromHash > 0) select(fromHash, false);

/* coverage strip: open the tab that shows a given event type */
document.getElementById('coverage').addEventListener('click', e => {
  const a = e.target.closest('a[data-goto]');
  if (!a) return;
  e.preventDefault();
  select(DATA.jobs.findIndex(j => j.id === a.dataset.goto), true);
});

/* ---------------- run expansion ---------------- */
document.addEventListener('click', e => {
  const rb = e.target.closest('.runbtn');
  if (rb) {
    const tl = rb.closest('.tl');
    const kids = tl.querySelectorAll(`[data-run-child="${rb.dataset.run}"]`);
    const open = rb.dataset.open === '1';
    kids.forEach(k => k.classList.toggle('show', !open));
    rb.dataset.open = open ? '0' : '1';
    rb.textContent = open ? `Show ${kids.length} cycles` : `Hide ${kids.length} cycles`;
    return;
  }
  const ff = e.target.closest('.btn[data-fields]');
  if (ff) {
    const tl = document.getElementById('tl-' + ff.dataset.fields);
    const compact = tl.classList.toggle('compact');
    ff.textContent = compact ? 'Show field detail' : 'Hide field detail';
    return;
  }
  const all = e.target.closest('.btn[data-all]');
  if (all) {
    const tl = document.getElementById('tl-' + all.dataset.all);
    const open = all.dataset.open === '1';
    tl.querySelectorAll('[data-run-child]').forEach(k => k.classList.toggle('show', !open));
    tl.querySelectorAll('.runbtn').forEach(b => {
      const n = tl.querySelectorAll(`[data-run-child="${b.dataset.run}"]`).length;
      b.dataset.open = open ? '0' : '1';
      b.textContent = open ? `Show ${n} cycles` : `Hide ${n} cycles`;
    });
    all.dataset.open = open ? '0' : '1';
    all.textContent = open ? 'Expand all cycles' : 'Collapse all cycles';
  }
});

document.getElementById('foot').innerHTML =
  `Reconstructed from ${fmt(DATA.total_events)} events in <span class="mono">${esc(DATA.source)}</span>. ` +
  `Across the file, ${DATA.context.never_started} jobs were created and never started, ${DATA.context.started_never_completed} started and never completed, ` +
  `and ${DATA.context.dupe_ids} event ids appear twice. Timestamps are UTC, exactly as recorded. ` +
  `Field-level counts for the whole stream are in the companion <a href="https://claude.ai/code/artifact/d9dc3563-cef2-457b-9d66-fdb989d3103e">Manufacturing Event Profile</a>.`;
</script>
